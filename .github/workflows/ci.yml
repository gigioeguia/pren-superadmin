name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dbrentpro_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Marcador del instalador: sin el, el middleware CheckToken borra
      # vendor/laravel en los feature tests (ver tests/README.md).
      - name: Create installer marker
        run: echo '{"marker":"installer"}' > vendor/autoload1.php

      # Sin .env, phpdotenv hace un @file_get_contents('.env') que el
      # printer de Collision reporta como warning en cada test que
      # bootea la app (tormenta de ~470 warns espurios, presentes desde
      # antes del paraguas 5.13 pero invisibles: warnings solos no
      # rompen el exit code). Un .env vacio silencia la lectura; las
      # vars criticas viven en phpunit.xml + los env del job.
      - name: Create empty env file
        run: touch .env

      # Los unit tests con DatabaseTransactions no migran (convencion
      # del repo): el esquema debe existir ANTES de la suite — p.ej.
      # ApplicationServiceTest corre alfabeticamente primero y sobre
      # una DB vacia falla con 'table not found'.
      - name: Migrate test database
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dbrentpro_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run test suite
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPStan (level 5 + baseline)
        run: vendor/bin/phpstan analyse --ansi --memory-limit=1G

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (test mode)
        run: vendor/bin/pint --test

  # Guard anti-reincidencia (spec 5.15 / F13): el lock no puede arrastrar
  # advisories de seguridad. Valvula documentada: si un advisory sin fix
  # disponible debe bloquear el merge, se ignora de forma explicita via
  # `audit.ignore` en composer.json con justificacion en el PR.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Composer audit (security advisories)
        run: composer audit --locked
